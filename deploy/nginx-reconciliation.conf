# Nginx — Reconciliation (Streamlit + API)
# Copier vers : /etc/nginx/sites-available/reconciliation
# Puis : ln -s /etc/nginx/sites-available/reconciliation /etc/nginx/sites-enabled/
#
# Remplacer server_name par le hostname ou l'IP du serveur.

upstream reconc_api {
    server 127.0.0.1:8002;
    keepalive 8;
}

upstream reconc_ui {
    server 127.0.0.1:8501;
}

server {
    listen 80;
    server_name _;   # ex. reconc.banque.local ou IP

    client_max_body_size 100M;

    # --- API FastAPI (Module_FED / outils externes) ---
    location /svc/ {
        proxy_pass http://reconc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /db/ {
        proxy_pass http://reconc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /reconciliation/ {
        proxy_pass http://reconc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /charger {
        proxy_pass http://reconc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://reconc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /partenaires {
        proxy_pass http://reconc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /statuts {
        proxy_pass http://reconc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /reset {
        proxy_pass http://reconc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- UI Streamlit (tout le reste) ---
    location / {
        proxy_pass http://reconc_ui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location /_stcore/stream {
        proxy_pass http://reconc_ui/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}
